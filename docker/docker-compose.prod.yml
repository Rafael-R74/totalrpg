services:
  totalrpg-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: totalrpg-app:latest
    container_name: totalrpg-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: 3333
      DATA_DIR: /app/data
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db?connection_limit=1}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://seu-dominio.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    volumes:
      # Mapeia a pasta inteira para suportar prod.db + prod.db-wal + prod.db-shm, uploads/ e packs/
      - ./data:/app/data
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M
