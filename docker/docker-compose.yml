services:
  postgres:
    image: postgres:16-alpine
    container_name: totalrpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-totalrpg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword123}
      POSTGRES_DB: ${DB_NAME:-totalrpg_db}
    ports:
      - "5432:5432"
    volumes:
      - totalrpg_pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - totalrpg-net

  redis:
    image: redis:7-alpine
    container_name: totalrpg-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - totalrpg_redisdata:/data
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - totalrpg-net

volumes:
  totalrpg_pgdata:
  totalrpg_redisdata:

networks:
  totalrpg-net:
    driver: bridge